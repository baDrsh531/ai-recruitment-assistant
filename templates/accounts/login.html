{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block anonymous %}
<div class="auth">
  <div class="auth__card">
    <h1 class="auth__title">Recrutement<span>.IA</span></h1>
    <p class="hint mt-4">Connectez-vous pour acceder aux candidatures.</p>

    <form method="post" class="mt-4">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert--error">{{ form.non_field_errors.0 }}</div>
      {% endif %}

      <div class="field">
        <label class="label" for="{{ form.username.id_for_label }}">Identifiant</label>
        <input class="input" type="text" name="username" id="{{ form.username.id_for_label }}"
               required autofocus autocomplete="username">
      </div>

      <div class="field">
        <label class="label" for="{{ form.password.id_for_label }}">Mot de passe</label>
        <input class="input" type="password" name="password" id="{{ form.password.id_for_label }}"
               required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn--primary mt-4" style="width: 100%; justify-content: center;">
        Se connecter
      </button>
    </form>
  </div>
</div>
{% endblock %}
